<!-- Modal de confirmación para eliminar un documento -->
<div class="modal-backdrop">
    <div class="modal modal-sm" role="dialog">
        <div class="modal-head">
            <div class="modal-head-left">
                <span class="material-icons" style="color:#ef4444;">warning</span>
                <h2>Eliminar Documento</h2>
            </div>
            <button class="modal-close" title="Cerrar">
                <span class="material-icons">close</span>
            </button>
        </div>

        <div class="modal-body">
            <p style="color:#475569;margin:0 0 1.25rem;font-size:0.9rem;line-height:1.5;">
                ¿Estás seguro de eliminar este documento?
            </p>

            <!-- Resumen de los datos del documento a eliminar -->
            <div class="delete-doc-info">
                <div class="delete-doc-row">
                    <span class="delete-doc-label">Expediente</span>
                    <span class="delete-doc-value">{{ doc.expediente_numero_registro }}</span>
                </div>
                <div class="delete-doc-row">
                    <span class="delete-doc-label">Código de verificación</span>
                    <span class="delete-doc-value code">{{ doc.codigo_verificacion }}</span>
                </div>
                <div class="delete-doc-row">
                    <span class="delete-doc-label">Ámbito</span>
                    <span class="delete-doc-value">{{ doc.ambito }}</span>
                </div>
            </div>

            <!-- Formulario → DELETE a /eliminar/<id>/ -->
            <form hx-delete="/eliminar/{{ doc.id }}/" hx-target="#main-content" hx-swap="innerHTML" hx-on::after-request="if(event.detail.successful) this.closest('.modal-backdrop').remove()">
                <div class="modal-actions" style="margin-top:1.5rem;">
                    <button type="button" class="btn-cancel modal-close-btn">Cancelar</button>
                    <button type="submit" class="btn-submit" style="width:auto;padding:0.75rem 1.5rem;background:#ef4444;">
                        <span>Eliminar</span>
                        <span class="material-icons">delete</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
